[project]
name = "deepsearch-agents"
version = "0.1.0"
description = "DeepAgents learning examples for deep research agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.5.7",
    "fastapi==0.142.2",
    "langchain==1.2.17",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "mysql-connector-python>=8.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "ragflow-sdk==0.25.4",
    "reportlab==5.0.1",
    "tavily-python==0.7.24",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.pyright]
exclude = ["examples"]  # 历史学习目录，错误来自第三方库类型标注不全，不纳入检查
